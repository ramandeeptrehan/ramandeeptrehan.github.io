---
layout: default
---

<div class="post-wrap">
  <article>
    <h2>{{ page.title }}</h2>
    <p class="meta">{{ page.date | date: "%B %d, %Y" }}</p>
    {% if page.tags.size > 0 %}
    <p class="post-tags">{% for tag in page.tags %}<a href="/writings/?tag={{ tag }}" class="tag">#{{ tag }}</a>{% endfor %}</p>
    {% endif %}
    <div class="post-content">
      {{ content }}
    </div>
    <p class="back"><a href="/writings/">← All writings</a></p>
  </article>
</div>
