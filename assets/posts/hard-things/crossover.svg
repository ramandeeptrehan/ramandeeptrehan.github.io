<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="620" height="320" fill="#fff"/>
  <line x1="80" y1="40" x2="80" y2="250" stroke="#999" stroke-width="1.5"/>
  <line x1="80" y1="250" x2="560" y2="250" stroke="#999" stroke-width="1.5"/>
  <text x="30" y="145" font-size="13" fill="#555" text-anchor="middle" transform="rotate(-90 30 145)">How much you remember</text>
  <text x="320" y="300" font-size="13" fill="#555" text-anchor="middle">Time since studying</text>
  <text x="120" y="270" font-size="12" fill="#777" text-anchor="middle">5 minutes</text>
  <text x="320" y="270" font-size="12" fill="#777" text-anchor="middle">2 days</text>
  <text x="520" y="270" font-size="12" fill="#777" text-anchor="middle">1 week</text>
  <polyline points="120,70 320,140 520,200" fill="none" stroke="#b0b0b0" stroke-width="3" stroke-dasharray="7 5"/>
  <polyline points="120,90 320,115 520,135" fill="none" stroke="#2f6fb3" stroke-width="3.5"/>
  <circle cx="120" cy="70" r="5" fill="#b0b0b0"/><circle cx="320" cy="140" r="5" fill="#b0b0b0"/><circle cx="520" cy="200" r="5" fill="#b0b0b0"/>
  <circle cx="120" cy="90" r="5" fill="#2f6fb3"/><circle cx="320" cy="115" r="5" fill="#2f6fb3"/><circle cx="520" cy="135" r="5" fill="#2f6fb3"/>
  <text x="140" y="60" font-size="13" fill="#777">Re-reading (feels easy)</text>
  <text x="400" y="104" font-size="13" fill="#2f6fb3" font-weight="600">Recalling (feels hard)</text>
  <text x="560" y="30" font-size="11" fill="#999" text-anchor="end">Schematic: shape of the result, not exact values</text>
</svg>
