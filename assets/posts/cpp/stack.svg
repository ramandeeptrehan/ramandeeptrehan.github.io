<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" width="560" height="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="560" height="310" fill="#fff"/><rect x="20" y="15" width="470" height="58" rx="6" fill="#fafafa" stroke="#dce5f5"/><text x="36" y="39" font-size="11" fill="#888" text-anchor="start" font-weight="normal">WHAT YOU WRITE</text><text x="36" y="59" font-size="14" fill="#333" text-anchor="start" font-weight="normal">Python: model(x), torch, numpy, pandas</text><rect x="20" y="87" width="470" height="58" rx="6" fill="#f5f8ff" stroke="#dce5f5"/><text x="36" y="111" font-size="11" fill="#888" text-anchor="start" font-weight="normal">WHAT IT CALLS</text><text x="36" y="131" font-size="14" fill="#333" text-anchor="start" font-weight="normal">C++ libraries: ATen / LibTorch, Arrow, Eigen, ONNX Runtime</text><rect x="20" y="159" width="470" height="58" rx="6" fill="#e8eef9" stroke="#dce5f5"/><text x="36" y="183" font-size="11" fill="#888" text-anchor="start" font-weight="normal">WHAT RUNS ON THE GPU</text><text x="36" y="203" font-size="14" fill="#333" text-anchor="start" font-weight="normal">CUDA C++ kernels: cuBLAS, cuDNN, CUTLASS, FlashAttention</text><rect x="20" y="231" width="470" height="58" rx="6" fill="#dce5f5" stroke="#dce5f5"/><text x="36" y="255" font-size="11" fill="#888" text-anchor="start" font-weight="normal">HARDWARE</text><text x="36" y="275" font-size="14" fill="#333" text-anchor="start" font-weight="normal">CPU cores, caches, memory bandwidth, GPUs, network</text><line x1="520" y1="22" x2="520" y2="290" stroke="#5572a8" stroke-width="2"/><path d="M513 282 L520 296 L527 282 Z" fill="#5572a8"/><text x="540" y="160" font-size="12" fill="#888" text-anchor="middle" transform="rotate(90 540 160)">closer to the machine</text></svg>
