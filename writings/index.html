---
layout: default
---

{% if site.posts.size > 0 %}
<ul class="writings-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url }}">{{ post.title }}</a>
    <span>{{ post.date | date: "%b %Y" }}</span>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="empty-state">Nothing here yet — first post coming soon.</p>
{% endif %}
