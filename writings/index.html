---
layout: default
title: Writings
---

{% if site.posts.size > 0 %}
<table>
  <thead>
    <tr><th>Title</th><th>Date</th></tr>
  </thead>
  <tbody>
    {% for post in site.posts %}
    <tr>
      <td><a href="{{ post.url }}">{{ post.title }}</a></td>
      <td>{{ post.date | date: "%b %Y" }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="empty-state">Nothing here yet — first post coming soon.</p>
{% endif %}
